name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Restore
      run: dotnet restore SistemaPintoSalinas.sln
    - name: Build
      run: dotnet build SistemaPintoSalinas.sln --no-restore -c Release
    - name: Test
      run: dotnet test tests/UtilsTests/UtilsTests.csproj --no-build -c Release
